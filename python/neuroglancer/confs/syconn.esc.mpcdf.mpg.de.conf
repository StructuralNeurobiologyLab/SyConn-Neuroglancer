    # -------------------------------------------

    # ---------- SYNTHETIC DATA (NEUROGLANCER PRECOMPUTED) ----------
    # Image (em, lm, xray, etc.), e.g. em_v2_seed0/
    location ~ /synem/val/em_mixed/image/info {
	add_header Access-Control-Allow-Origin *;
	add_header Content-type application/json;
	alias /new_mounts/wholebrain/songbird/synthetic_em/benchmark/val/em_mixed/image_v40_seed100/info;
    }

    location ~ /synem/val/em_mixed/image/([0-9]+)_([0-9]+)_([0-9]+)/(.*) {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/octet-stream;
	add_header Content-encoding gzip;
        alias /new_mounts/wholebrain/songbird/synthetic_em/benchmark/val/em_mixed/image_v40_seed100/$1_$2_$3/$4.gz;
    }

    location ~ /synem/val/em_mixed/seg/info {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/json;
        alias /new_mounts/wholebrain/songbird/synthetic_em/benchmark/val/em_mixed/segmentation_v40_seed100/info;
    }

    location ~ /synem/val/em_mixed/seg/([0-9]+)_([0-9]+)_([0-9]+)/(.*) {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/octet-stream;
        add_header Content-encoding gzip;
        alias /new_mounts/wholebrain/songbird/synthetic_em/benchmark/val/em_mixed/segmentation_v40_seed100/$1_$2_$3/$4.gz;
    }

    location ~ /synem/img/v([0-9]+)_seed([0-9]+)/([0-9]+)_([0-9]+)_([0-9]+)/(.*) {
        add_header Access-Control-Allow-Origin *;
	add_header Content-type application/octet-stream;
        add_header Content-encoding gzip;
        alias /new_mount/wholebrain/songbird/synthetic_em/em_v$1_seed$2/$3_$4_$5/$6.gz;
    }
    # Segmentation (single- or multi-scale), e.g. segmentation_downsampled_v32_seed1/
    location ~ /synem/seg/v([0-9]+)_seed([0-9]+)/info {
        add_header Access-Control-Allow-Origin *;
	add_header Content-type application/json;
        alias /new_mounts/wholebrain/songbird/synthetic_em/segmentation_downsampled_v$1_seed$2/info;
    }

    location ~ /synem/seg/v([0-9]+)_seed([0-9]+)/([0-9]+)_([0-9]+)_([0-9]+)/(.*) {
	add_header Access-Control-Allow-Origin *;
	add_header Content-type application/octet-stream;
	add_header Content-encoding gzip;
	alias /new_mounts/wholebrain/songbird/synthetic_em/segmentation_downsampled_v$1_seed$2/$3_$4_$5/$6.gz;
    }

    # Skeletons, e.g. segmentation_downsampled_v32_seed1/skeletons
    location ~ /synem/seg/v([0-9]+)_seed([0-9]+)/skeletons/info {
        add_header Access-Control-Allow-Origin *;
	add_header Content-type application/json;
        alias /new_mounts/wholebrain/songbird/synthetic_em/segmentation_downsampled_v$1_seed$2/skeletons/info;
    }

    location ~ /synem/seg/v([0-9]+)_seed([0-9]+)/skeletons/([0-9]+) {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/octet-stream;
	add_header Content-encoding gzip;
        alias /new_mounts/wholebrain/songbird/synthetic_em/segmentation_downsampled_v$1_seed$2/skeletons/$3.gz;
    }

    # Meshes, e.g. segmentation_downsampled_v32_seed1/mesh_mip_0_err_40/
    location ~ /synem/seg/v([0-9]+)_seed([0-9]+)/mesh_(.*)/info {
        add_header Access-Control-Allow-Origin *;
	add_header Content-type application/json;
        alias /new_mounts/wholebrain/songbird/synthetic_em/segmentation_downsampled_v$1_seed$2/mesh_$3/info;
    }

    location ~ /synem/seg/v([0-9]+)_seed([0-9]+)/mesh_(.*)/([0-9]+):0 {
        add_header Access-Control-Allow-Origin *;
	add_header Content-type application/json;
        alias /new_mounts/wholebrain/songbird/synthetic_em/segmentation_downsampled_v$1_seed$2/mesh_$3/$4:0;
    } 

    location ~ /synem/seg/v([0-9]+)_seed([0-9]+)/mesh_(.*)/([0-9]+):0:([^/]+) {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/octet-stream;
	add_header Content-encoding gzip;
        alias /new_mounts/wholebrain/songbird/synthetic_em/segmentation_downsampled_v$1_seed$2/mesh_$3/$4:0:$5.gz;
    }
    # --------------------------------------------

    # ---------------- X-RAY DATA ----------------
    location ~ /xray/info {
        add_header Access-Control-Allow-Origin *;
        alias /new_mounts/wholebrain/songbird/bm05_xray/info;
    }

    location ~ /xray/(.*)/(.*) {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/octet-stream;
        add_header Content-encoding gzip;
        alias /new_mounts/wholebrain/songbird/bm05_xray_res_727.8nm/$1/$2.gz;
    }
    # --------------------------------------------

    # ----------- ER INSTANCE SEGMENTATION -------
    location ~ /er/info {
        add_header Access-Control-Allow-Origin *;
        alias /new_mounts/wholebrain/songbird/j0251/j0251_72_seg_20210127_agglo2_syn_20220811_celltypes_20230822/precomputed_datasets/er_instance_seg_1_round_dilation_erosion_thresh_100/info;
    } 

    location ~ /er/(.*)/(.*) {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/octet-stream;
        add_header Content-encoding gzip;
        alias /new_mounts/wholebrain/songbird/j0251/j0251_72_seg_20210127_agglo2_syn_20220811_celltypes_20230822/precomputed_datasets/er_instance_seg_1_round_dilation_erosion_thresh_100/$1/$2.gz;
    }
    # --------------------------------------------
  
    # ------------ ER MESHES --------------------- 
    location ~* /er/mesh/info {
        add_header Access-Control-Allow-Origin *;
        alias /new_mounts/wholebrain/songbird/j0251/j0251_72_seg_20210127_agglo2_syn_20220811_celltypes_20230822/precomputed_datasets/er_instance_seg_1_round_dilation_erosion_thresh_100/mesh_mip_1_err_40/info;
    }

    location ~ /er/mesh/([0-9]+):0 {
        add_header Access-Control-Allow-Origin *;
        alias /new_mounts/wholebrain/songbird/j0251/j0251_72_seg_20210127_agglo2_syn_20220811_celltypes_20230822/precomputed_datasets/er_instance_seg_1_round_dilation_erosion_thresh_100/mesh_mip_1_err_40/$1:0;
    }

    location ~ /er/mesh/([0-9]+):0:([^/]+) {
        add_header Access-Control-Allow-Origin *;
        add_header Content-type application/octet-stream;
        add_header Content-encoding gzip;
        alias /new_mounts/wholebrain/songbird/j0251/j0251_72_seg_20210127_agglo2_syn_20220811_celltypes_20230822/precomputed_datasets/er_instance_seg_1_round_dilation_erosion_thresh_100/mesh_mip_1_err_40/$1:0:$2.gz; 
    }
    # ---------------------------------------------
    # Home page, served through tornado
    location / {
        proxy_pass http://neuroglancer;
        proxy_http_version 1.1;
        proxy_redirect off;
	chunked_transfer_encoding off;
	proxy_buffering off;
	proxy_cache off;
        # Upgrade http connections to WebSocket connections (required by neuroglancer)
        # proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection '';
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Scheme $scheme;
        error_page 502 /502.html;
    }

    # Server down page
    location /502.html {
	root /var/www/502;
    }
    
    location = /style.css {
	root /var/www/502;
    }

     location = /script.js {
	root /var/www/502;
    }

    location ~ /\.(png|gif|jpg|jpeg)$ {
	root /var/www;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/syconn.esc.mpcdf.mpg.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/syconn.esc.mpcdf.mpg.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


