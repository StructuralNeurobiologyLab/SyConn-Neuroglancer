# NGINX configuration file for the SyConn-Neuroglancer web server
upstream neuroglancer {
    ip_hash;
    server localhost:5000;
    server localhost:5001;
    server localhost:5002;
    server localhost:5003;

    # keepalive 32; # number of keepalive connections per worker process
}

proxy_read_timeout 200;

# Set Connection header to close when Upgrade header is '' (necessary for websocket connections)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format compression '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $bytes_sent '
                       '"$http_referer" "$http_user_agent" "$gzip_ratio"';

error_log /var/log/error.log warn;
access_log  /var/log/access.log compression buffer=32k flush=10m;

server {
#    listen 443 ssl http2 default_server; # managed by Certbot
#    ssl_certificate /etc/letsencrypt/live/syconn.esc.mpcdf.mpg.de/fullchain.pem; # managed by Certbot
#    ssl_certificate_key /etc/letsencrypt/live/syconn.esc.mpcdf.mpg.de/privkey.pem; # managed by Certbot
#    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
#    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    server_name syconn.esc.mpcdf.mpg.de;
    include /etc/nginx/mime.types;
	
    # Basic http authentication
    # auth_basic "Administrator's Area";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/ld+json
           json image/bmp image/svg+xml;


