upstream dev {
    ip_hash;
    server localhost:8005;
    #server localhost:5001;
   # server localhost:5002;
    #server localhost:5003;

    # keepalive 32; # number of keepalive connections per worker process
}

# Set Connection header to close when Upgrade header is '' (necessary for websocket connections)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen localhost:9000;
#   listen loaclhost:9005;
#    listen 443 ssl http2;
    server_name dev.syconn.esc.mpcdf.mpg.de www.dev.syconn.esc.mpcdf.mpg.de;
#    ssl_certificate /usr/share/nginx/html/localhost.pem;
#    ssl_certificate_key /usr/share/nginx/html/localhost-key.pem;
    listen 80;

    include /etc/nginx/mime.types;
    # root /usr/share/nginx/html;
    index demo-index.html;
    expires -1;

    # Basic http authentication
    auth_basic "Administrator's Area";
    auth_basic_user_file /etc/nginx/.htpasswd;    

    gzip on;

